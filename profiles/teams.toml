# Fictional team presets for the simulator. Names are regional, never club names; players
# are generated fictional names. Values are hand-set qualitative approximations of playing
# styles, not derived from any real match data. `nel` and `yob` are tuned for the demo seed;
# the rest are rough.
#
# possession_bias      relative weight of starting a possession sequence (long-ball teams start
#                      many short ones, so their time share is lower than this suggests)
# pass_completion      chance a short pass completes (long passes: -0.25)
# long_ball_pct        share of passes that are long
# shot_rate            chance a sequence reaching the final third ends in a shot
# shot_distance_*_m    shot distance from goal centre, normal distribution
# pressures_per_5min   opponent-half pressing intensity

[team.nwl]
name = "North West London"
short = "NWL"
colors = ["#D7262E", "#FFFFFF"]
possession_bias = 1.4
pass_completion = 0.88
long_ball_pct = 0.06
shot_rate = 0.30
shot_distance_mean_m = 16.0
shot_distance_sd_m = 5.0
pressures_per_5min = 9.0

