[project]
name = "second-look"
version = "0.1.0"
description = "An AI sceptic for football: detectors find misleading stats, agents argue about them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core>=1.22.0",
    "azure-identity>=1.26.0",
    "fastapi>=0.156.8",
    "openai>=3.35.1",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
second-look-sim = "second_look.sim:main"
second-look-cards = "second_look.build_cards:main"

[project.optional-dependencies]
tracing = [
    "azure-monitor-opentelemetry-exporter>=1.0.0b58",
    "opentelemetry-instrumentation-openai-v2==2.4b0",
    "opentelemetry-util-genai==0.4b0",  # pinned together: 1.x drops a module openai-v2 2.4b0 imports
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_look"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/second_look/templates.py" = ["E501"]  # card text reads better unwrapped
