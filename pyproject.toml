[project]
name = "second-look"
version = "0.1.0"
description = "An AI sceptic for football: detectors find misleading stats, agents argue about them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "azure-identity>=1.26.0",
    "openai>=3.35.1",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
]

[project.scripts]
second-look-sim = "second_look.sim:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["second_look"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
