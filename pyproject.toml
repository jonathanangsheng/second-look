[project]
name = "second-look"
version = "0.1.0"
description = "An AI sceptic for football: detectors find misleading stats, agents argue about them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["second_look"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
