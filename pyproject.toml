[project]
name = "second-look"
version = "0.1.0"
description = "An AI sceptic for football: detectors find misleading stats, agents argue about them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agent-framework-core>=1.22.0",
    "azure-identity>=1.26.0",
    "fastapi>=0.156.8",
    "openai>=3.35.1",
    "pydantic>=2.7",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
second-look-sim = "second_look.sim:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["second_look"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
